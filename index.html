<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MC基岩版站点</title>
    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial,sans-serif;
        }
        /* 视频全屏背景 */
        #bgVideo{
            position:fixed;
            top:0;
            left:0;
            width:100vw;
            height:100vh;
            object-fit:cover;
            z-index:-2;
        }
        .overlay{
            position:fixed;
            top:0;
            left:0;
            width:100%;
            height:100%;
            background:rgba(255,255,255,0.15);
            z-index:-1;
        }
        .container{
            max-width:600px;
            margin:0 auto;
            padding:40px 20px;
        }
        /* 右上角登录按钮 */
        .login-top{
            position:absolute;
            top:20px;
            right:20px;
        }
        /* 顶部大标题图片 */
        .title-img{
            width:100%;
            max-width:500px;
            display:block;
            margin:0 auto 40px;
        }
        /* 蓝紫渐变圆角边框 + 毛玻璃模糊按钮 */
        .btn{
            display:block;
            width:100%;
            padding:16px;
            margin:14px 0;
            text-align:center;
            text-decoration:none;
            color:#111827;
            font-size:18px;
            font-weight:500;
            border:2px solid transparent;
            border-radius:16px;
            background:rgba(255,255,255,0.28);
            backdrop-filter:blur(18px);
            -webkit-backdrop-filter:blur(18px);
            background-image:
                linear-gradient(rgba(255,255,255,0.28),rgba(255,255,255,0.28)),
                linear-gradient(90deg,#2563eb,#9333ea);
            background-origin:border-box;
            background-clip:padding-box,border-box;
            transition:0.3s ease;
            box-shadow:0 8px 20px rgba(0,0,0,0.08);
        }
        .btn:hover{
            background:rgba(255,255,255,0.45);
            transform:translateY(-2px);
            box-shadow:0 12px 28px rgba(37,99,235,0.15);
        }
        /* 回到顶部 */
        #backTop{
            position:fixed;
            bottom:30px;
            right:30px;
            width:50px;
            height:50px;
            border-radius:50%;
            border:2px solid transparent;
            background:rgba(255,255,255,0.28);
            backdrop-filter:blur(18px);
            -webkit-backdrop-filter:blur(18px);
            background-image:
                linear-gradient(rgba(255,255,255,0.28),rgba(255,255,255,0.28)),
                linear-gradient(90deg,#2563eb,#9333ea);
            background-origin:border-box;
            background-clip:padding-box,border-box;
            font-size:20px;
            cursor:pointer;
            display:none;
        }
        /* 弹窗动画+毛玻璃 */
        .modal{
            position:fixed;
            top:0;
            left:0;
            width:100%;
            height:100%;
            background:rgba(0,0,0,0.5);
            display:none;
            justify-content:center;
            align-items:center;
            z-index:999;
        }
        .modal-box{
            background:rgba(255,255,255,0.3);
            backdrop-filter:blur(20px);
            -webkit-backdrop-filter:blur(20px);
            padding:30px;
            border-radius:18px;
            border:2px solid transparent;
            background-image:
                linear-gradient(rgba(255,255,255,0.3),rgba(255,255,255,0.3)),
                linear-gradient(90deg,#2563eb,#9333ea);
            background-origin:border-box;
            background-clip:padding-box,border-box;
            max-width:400px;
            width:90%;
            transform:scale(0.7);
            opacity:0;
            transition:all 0.3s ease;
        }
        .modal.show .modal-box{
            transform:scale(1);
            opacity:1;
        }
        .close-btn{
            margin-top:20px;
            padding:10px 20px;
            border:2px solid transparent;
            border-radius:12px;
            background:rgba(255,255,255,0.28);
            backdrop-filter:blur(18px);
            -webkit-backdrop-filter:blur(18px);
            background-image:
                linear-gradient(rgba(255,255,255,0.28),rgba(255,255,255,0.28)),
                linear-gradient(90deg,#2563eb,#9333ea);
            background-origin:border-box;
            background-clip:padding-box,border-box;
            color:#111827;
            cursor:pointer;
        }
    </style>
</head>
<body>
    <video autoplay muted loop playsinline id="bgVideo">
        <source src="video.mp4" type="video/mp4">
    </video>
    <div class="overlay"></div>

    <div class="login-top">
        <a href="login.html" class="btn">登录</a>
    </div>

    <div class="container">
        <img src="title.png" alt="MC基岩版站点" class="title-img">

        <a href="https://mcrac.top" class="btn">安卓版mc基岩版下载</a>
        <a href="https://www.mcappx.com" class="btn">windows mc基岩版下载</a>
        <button class="btn" onclick="openServerModal()">加入我的mc基岩版服务器</button>
        <a href="Eaglercraft 1.16.5 (u2-beta).html" class="btn">mc网页版1.16.5</a>
        <a href="https://www.chunkbase.com" class="btn">种子码查询</a>
        <a href="https://zh.minecraft.wiki/" class="btn">Minecraft维基百科</a>
        <a href="https://www.minecrafttoolkit.com/calculators/enchantment" class="btn">附魔计算器</a>
        <a href="#" class="btn">服务器状态查询</a>
        <a href="https://yzbwdlt.pages.dev/docs/docs/commands/all_commands/" class="btn">游戏指令速查表</a>
        <button class="btn" onclick="openAboutModal()">关于</button>
    </div>

    <!--服务器弹窗-->
    <div class="modal" id="serverModal">
        <div class="modal-box">
            <h3>服务器信息</h3>
            <p style="margin:15px 0">地址:cn‑hk‑bgp‑4.ofalias.net<br>端口：33276</p>
            <a href="minecraft://?addExternalServer&name=我的服务器&address=cn-hk-bgp-4.ofalias.net&port=33276" class="close-btn">点击加入服务器</a>
            <br>
            <button class="close-btn" onclick="closeServerModal()">关闭</button>
        </div>
    </div>

    <!--关于弹窗-->
    <div class="modal" id="aboutModal">
        <div class="modal-box">
            <h3>关于本站</h3>
            <p style="margin:15px 0">这是一个MC基岩版玩家自制站点，提供下载、联机工具、游戏查询等功能。所有资源仅供玩家学习交流使用。</p>
            <button class="close-btn" onclick="closeAboutModal()">关闭</button>
        </div>
    </div>

    <button id="backTop" onclick="window.scrollTo({top:0,behavior:'smooth'})">↑</button>

    <script>
        function openServerModal(){
            const m=document.getElementById('serverModal');
            m.style.display='flex';
            setTimeout(()=>m.classList.add('show'),10);
        }
        function closeServerModal(){
            const m=document.getElementById('serverModal');
            m.classList.remove('show');
            setTimeout(()=>m.style.display='none',300);
        }
        function openAboutModal(){
            const m=document.getElementById('aboutModal');
            m.style.display='flex';
            setTimeout(()=>m.classList.add('show'),10);
        }
        function closeAboutModal(){
            const m=document.getElementById('aboutModal');
            m.classList.remove('show');
            setTimeout(()=>m.style.display='none',300);
        }

        window.onscroll=()=>{
            const btn=document.getElementById('backTop');
            btn.style.display=window.scrollY>200?'block':'none';
        }
    </script>
</body>
</html>
